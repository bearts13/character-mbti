<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色互动实验室 · 测测你的MBTI</title>
<meta name="description" content="8题自测你的MBTI人格，找到与你同频的角色；浏览16型人格角色分布、生成金句卡片。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f0a1e;
    color: #e8e4f5;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-gradient {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(124, 92, 255, 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255, 107, 157, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px; }

  .top-bar { margin-bottom: 28px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: #b8b0d4; text-decoration: none; font-size: 14px;
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; transition: all 0.3s ease; background: rgba(255,255,255,0.04);
  }
  .back-btn:hover { color: #fff; border-color: rgba(167,139,250,0.4); background: rgba(124,92,255,0.15); }

  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-size: 40px; font-weight: 900; margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, #a78bfa 50%, #ff6b9d 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header .subtitle { font-size: 15px; color: #b8b0d4; line-height: 1.7; }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px;
  }
  .tab {
    padding: 10px 22px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05); color: #b8b0d4; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.3s ease;
  }
  .tab:hover { color: #fff; border-color: rgba(167,139,250,0.4); }
  .tab.active {
    background: linear-gradient(135deg, #7c5cff, #a78bfa); color: #fff; border-color: transparent;
    box-shadow: 0 4px 20px rgba(124,92,255,0.4);
  }
  .tab-panel { display: none; animation: fadeIn 0.4s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .panel-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 28px; margin-bottom: 20px;
  }
  .panel-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  .panel-card .desc { font-size: 13px; color: #9891b3; margin-bottom: 20px; line-height: 1.6; }

  /* Mode switch */
  .mode-switch { display: flex; gap: 8px; margin-bottom: 24px; }
  .mode-btn {
    padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12);
    background: transparent; color: #b8b0d4; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.3s ease;
  }
  .mode-btn.active { background: rgba(124,92,255,0.25); color: #fff; border-color: #7c5cff; }

  /* Quiz */
  .quiz-item { margin-bottom: 24px; }
  .quiz-item .q { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .quiz-item .q .dim-tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(124,92,255,0.2); color: #a78bfa; margin-right: 8px; vertical-align: 2px;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option {
    padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); color: #d5cfe8; font-size: 14px; cursor: pointer;
    transition: all 0.25s ease; line-height: 1.5;
  }
  .quiz-option:hover { border-color: rgba(167,139,250,0.5); background: rgba(124,92,255,0.1); }
  .quiz-option.selected {
    border-color: #7c5cff; background: rgba(124,92,255,0.2); color: #fff;
    box-shadow: 0 0 0 1px #7c5cff;
  }
  .quiz-option .opt-key {
    display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center;
    border-radius: 50%; background: rgba(255,255,255,0.1); font-size: 12px; margin-right: 10px;
    font-weight: 700;
  }
  .quiz-option.selected .opt-key { background: #7c5cff; }

  /* Manual select */
  .manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .manual-dim {
    padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
  }
  .manual-dim .dim-label { font-size: 13px; color: #9891b3; margin-bottom: 12px; }
  .manual-dim .dim-label b { color: #a78bfa; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: transparent; color: #b8b0d4; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.25s ease;
  }
  .toggle-btn:hover { border-color: rgba(167,139,250,0.5); }
  .toggle-btn.selected { background: linear-gradient(135deg, #7c5cff, #a78bfa); color: #fff; border-color: transparent; }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 30px; background: linear-gradient(135deg, #7c5cff, #a78bfa); color: #fff;
    border: none; border-radius: 26px; font-weight: 700; font-size: 14px; cursor: pointer;
    transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(124,92,255,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124,92,255,0.5); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 30px; background: rgba(255,255,255,0.08); color: #e8e4f5;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 26px; font-weight: 600;
    font-size: 14px; cursor: pointer; transition: all 0.3s ease;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }

  /* Result */
  .result-box { text-align: center; padding: 32px 20px; }
  .result-mbti {
    font-size: 64px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #fff, #a78bfa, #ff6b9d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .result-cn { font-size: 18px; color: #a78bfa; font-weight: 600; margin: 6px 0 4px; }
  .result-tagline { font-size: 13px; color: #9891b3; margin-bottom: 8px; }
  .result-scores { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 8px; }
  .score-chip {
    padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); font-size: 13px; color: #d5cfe8;
  }
  .score-chip b { color: #ff6b9d; }
  .result-chars { margin-top: 24px; text-align: left; }
  .result-chars .group-title { font-size: 14px; font-weight: 700; color: #a78bfa; margin: 20px 0 12px; }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .char-card {
    display: block; text-decoration: none; padding: 16px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .char-card:hover { transform: translateY(-3px); border-color: rgba(167,139,250,0.4); background: rgba(255,255,255,0.08); }
  .char-card .cc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .char-card .cc-avatar {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #7c5cff, #ff6b9d); font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .char-card .cc-name { font-size: 15px; font-weight: 700; color: #fff; }
  .char-card .cc-work { font-size: 11px; color: #9891b3; }
  .char-card .cc-conf { font-size: 11px; color: #ff6b9d; margin-top: 2px; }
  .char-card .cc-kw { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .char-card .kw {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(124,92,255,0.15); color: #b8b0d4;
  }
  .char-card .cc-arrow { position: absolute; right: 14px; bottom: 14px; color: #a78bfa; font-size: 16px; }

  /* Card */
  select {
    padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: #1a1330; color: #e8e4f5; font-size: 14px; outline: none; cursor: pointer;
    min-width: 180px;
  }
  select:focus { border-color: #7c5cff; }
  .card-setup { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .card-setup select { flex: 1; min-width: 160px; max-width: 240px; }
  .char-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px;
    margin-bottom: 20px; max-height: 320px; overflow-y: auto; padding: 4px;
  }
  .char-card {
    text-align: center; cursor: pointer; padding: 10px 6px 8px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
    transition: all 0.25s ease;
  }
  .char-card:hover { border-color: rgba(167,139,250,0.5); transform: translateY(-2px); background: rgba(124,92,255,0.08); }
  .char-card.selected { border-color: #7c5cff; background: rgba(124,92,255,0.18); box-shadow: 0 0 0 1px #7c5cff; }
  .char-card .cc-avatar {
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover; display: block;
    margin: 0 auto 6px; border: 2px solid rgba(255,255,255,0.25);
  }
  .char-card .cc-avatar-fallback {
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px; border: 2px solid rgba(255,255,255,0.25); color: #fff;
    font-size: 22px; font-weight: 700;
  }
  .char-card .cc-name { font-size: 12px; color: #d5cfe8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-card.selected .cc-name { color: #fff; }
  .quote-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .quote-item {
    padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); color: #d5cfe8; font-size: 14px; cursor: pointer;
    transition: all 0.25s ease; line-height: 1.6;
  }
  .quote-item:hover { border-color: rgba(167,139,250,0.5); }
  .quote-item.selected { border-color: #7c5cff; background: rgba(124,92,255,0.15); color: #fff; }
  .card-preview { text-align: center; margin: 20px 0; }
  #quote-canvas { max-width: 100%; width: 420px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

  .empty-tip { text-align: center; padding: 40px 20px; color: #9891b3; font-size: 14px; }

  /* 16型人格宫格 */
  .mbti-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .mbti-cell {
    padding: 18px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); text-align: center; cursor: pointer;
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .mbti-cell::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, #7c5cff, #ff6b9d); transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .mbti-cell:hover { transform: translateY(-3px); border-color: rgba(167,139,250,0.5); background: rgba(255,255,255,0.08); }
  .mbti-cell:hover::before { transform: scaleX(1); }
  .mbti-cell .cell-type { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; }
  .mbti-cell .cell-cn { font-size: 12px; color: #a78bfa; margin-top: 4px; }
  .mbti-cell .cell-count {
    display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 12px;
    background: rgba(124,92,255,0.2); color: #b8b0d4; font-size: 11px;
  }
  .mbti-cell.empty { opacity: 0.45; cursor: default; }
  .mbti-cell.empty:hover { transform: none; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); }
  .mbti-cell.empty:hover::before { transform: scaleX(0); }
  .mbti-cell.empty .cell-count { background: rgba(255,255,255,0.06); color: #6b6485; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(10,6,24,0.75);
    backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  .modal-box {
    width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
    background: #171026; border: 1px solid rgba(167,139,250,0.3); border-radius: 18px; padding: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .modal-mbti {
    font-size: 30px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(135deg, #fff, #a78bfa, #ff6b9d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .modal-cn { font-size: 15px; color: #a78bfa; font-weight: 600; }
  .modal-close {
    margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #b8b0d4; font-size: 20px; line-height: 1; cursor: pointer; transition: all 0.25s ease;
  }
  .modal-close:hover { color: #fff; border-color: rgba(167,139,250,0.5); background: rgba(124,92,255,0.2); }
  .modal-body .group-title { font-size: 14px; font-weight: 700; color: #a78bfa; margin: 18px 0 10px; }
  .modal-body .group-title:first-child { margin-top: 0; }

  /* Mobile */
  @media (max-width: 768px) {
    .container { padding: 24px 14px 60px; }
    header h1 { font-size: 30px; }
    .panel-card { padding: 20px 16px; }
    .manual-grid { grid-template-columns: 1fr; }
    .result-mbti { font-size: 48px; }
    .char-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .card-setup { flex-direction: column; align-items: stretch; }
    select { width: 100%; }
    .card-setup .btn-primary { width: 100%; }
    .mbti-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
  @media (max-width: 480px) {
    header h1 { font-size: 26px; }
    .tabs { gap: 6px; }
    .tab { padding: 8px 14px; font-size: 13px; }
    .quiz-option { font-size: 13px; padding: 12px 12px; }
    .result-mbti { font-size: 40px; }
    .char-grid { grid-template-columns: 1fr; }
    .mbti-cell .cell-type { font-size: 18px; }
    .modal-box { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回首页</a>
  </div>

  <header>
    <h1>角色互动实验室</h1>
    <p class="subtitle">8题自测你的 MBTI，找到与你同频的角色 · 生成专属金句卡片</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="match">🧬 人格匹配</button>
    <button class="tab" data-tab="grid">🗺️ 16型人格</button>
    <button class="tab" data-tab="card">🃏 金句卡片</button>
  </div>

  <!-- ========== Tab 1: 人格匹配 ========== -->
  <section id="tab-match" class="tab-panel active">
    <div class="panel-card">
      <h3>找到与你同频的角色</h3>
      <p class="desc">8题自测你的MBTI，看看哪些角色和你一样。</p>

      <div class="mode-switch">
        <button class="mode-btn active" data-mode="quiz">✨ 快速自测</button>
        <button class="mode-btn" data-mode="manual">🎛️ 手动选型</button>
      </div>

      <!-- 自测模式 -->
      <div id="quiz-mode">
        <div id="quiz-questions"></div>
        <div style="text-align:center; margin-top: 8px;">
          <button class="btn-primary" id="quiz-submit" disabled>查看结果</button>
        </div>
      </div>

      <!-- 手动选型模式 -->
      <div id="manual-mode" style="display:none;">
        <div class="manual-grid" id="manual-grid"></div>
        <div style="text-align:center;">
          <button class="btn-primary" id="manual-submit">查看结果</button>
        </div>
      </div>

      <!-- 匹配结果 -->
      <div id="match-result" class="result-box" style="display:none;"></div>
    </div>
  </section>

  <!-- ========== Tab 2: 16型人格 ========== -->
  <section id="tab-grid" class="tab-panel">
    <div class="panel-card">
      <h3>16型人格总览</h3>
      <p class="desc">点击任意人格类型，查看所有拥有该人格的虚拟角色。</p>
      <div class="mbti-grid" id="mbti-grid"></div>
    </div>
    <!-- 模态框：点击人格后显示角色列表 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span class="modal-mbti" id="modal-mbti"></span>
          <span class="modal-cn" id="modal-cn"></span>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
  </section>

  <!-- ========== Tab 4: 金句卡片 ========== -->
  <section id="tab-card" class="tab-panel">
    <div class="panel-card">
      <h3>金句卡片生成</h3>
      <p class="desc">选一个角色和他的经典台词，生成一张可分享的社交图片卡片。</p>
      <div class="card-setup">
        <select id="filter-work"><option value="">全部作品</option></select>
        <select id="filter-mbti"><option value="">全部人格类型</option></select>
      </div>
      <div id="char-grid" class="char-grid"></div>
      <div id="card-quotes" class="quote-list"></div>
      <div class="card-preview">
        <canvas id="quote-canvas" width="1080" height="1350"></canvas>
      </div>
      <div style="text-align:center;">
        <button class="btn-primary" id="card-download">⬇️ 下载图片</button>
      </div>
    </div>
  </section>
</div>

<script src="data/characters.js"></script>
<script>
/* ========== 常量 ========== */
const MBTI_INFO = {
  'INTJ': ['建筑师', '独立思考的战略家'], 'INTP': ['逻辑学家', '思维跳跃的发明家'],
  'ENTJ': ['指挥官', '果断的领导者'], 'ENTP': ['辩论家', '充满创意的挑战者'],
  'INFJ': ['提倡者', '理想主义的引路人'], 'INFP': ['调停者', '诗意的理想主义者'],
  'ENFJ': ['主人公', '富有魅力的领导者'], 'ENFP': ['竞选者', '热情的自由灵魂'],
  'ISTJ': ['物流师', '务实可靠的守护者'], 'ISFJ': ['守卫者', '温暖尽责的保护者'],
  'ESTJ': ['总经理', '高效的组织者'], 'ESFJ': ['执政官', '热心的社交家'],
  'ISTP': ['鉴赏家', '冷静的实干家'], 'ISFP': ['探险家', '灵活的艺术家'],
  'ESTP': ['企业家', '大胆的行动派'], 'ESFP': ['表演者', '活力四射的娱乐家'],
};
const DIM_LABELS = { 'IE': '能量来源', 'NS': '信息获取', 'TF': '决策方式', 'JP': '生活方式' };
const DIM_PAIRS = [['I','E'], ['N','S'], ['T','F'], ['J','P']];

/* 用户测试结果（全局共享） */
let userResult = null;

/* ========== 工具 ========== */
function mbtiCn(mbti) {
  const info = MBTI_INFO[mbti];
  return info ? info[0] : '';
}
function mbtiTagline(mbti) {
  const info = MBTI_INFO[mbti];
  return info ? info[1] : '';
}
function scoreOf(c, letter) {
  const s = c.scores || {};
  return s[letter] !== undefined ? s[letter] : 50;
}

/* ========== Tab 切换 ========== */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
// 支持 URL hash 直达标签，如 play.html#card 直接打开金句卡片
if (location.hash && document.getElementById('tab-' + location.hash.slice(1))) {
  switchTab(location.hash.slice(1));
}

let quizAnswers = {};

function renderQuiz() {
  const wrap = document.getElementById('quiz-questions');
  wrap.innerHTML = QUIZ.map((item, qi) => `
    <div class="quiz-item">
      <div class="q"><span class="dim-tag">${DIM_LABELS[item.dim]}</span>${item.q}</div>
      <div class="quiz-options">
        ${item.opts.map((op, oi) => `
          <div class="quiz-option ${quizAnswers[qi] === oi ? 'selected' : ''}" data-qi="${qi}" data-oi="${oi}">
            <span class="opt-key">${String.fromCharCode(65 + oi)}</span>${op.t}
          </div>`).join('')}
      </div>
    </div>`).join('');

  wrap.querySelectorAll('.quiz-option').forEach(el => {
    el.addEventListener('click', () => {
      const qi = +el.dataset.qi, oi = +el.dataset.oi;
      quizAnswers[qi] = oi;
      el.parentElement.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      const done = Object.keys(quizAnswers).length;
      document.getElementById('quiz-submit').disabled = done < QUIZ.length;
    });
  });
}

function computeQuizResult() {
  const dims = ['IE', 'NS', 'TF', 'JP'];
  const leftLetters = { IE: 'I', NS: 'N', TF: 'T', JP: 'J' };
  const rightLetters = { IE: 'E', NS: 'S', TF: 'F', JP: 'P' };
  const scores = { I: 50, E: 50, N: 50, S: 50, T: 50, F: 50, J: 50, P: 50 };
  let mbti = '';

  dims.forEach(dim => {
    const qs = QUIZ.map((q, i) => ({ i, dim: q.dim })).filter(x => x.dim === dim);
    let rightCount = 0;
    qs.forEach(({ i }) => {
      const oi = quizAnswers[i];
      const v = QUIZ[i].opts[oi].v;
      if (v === rightLetters[dim]) rightCount++;
    });
    // rightCount: 0, 1, 2
    const rightPct = rightCount === 2 ? 68 : (rightCount === 1 ? 53 : 32);
    const leftPct = 100 - rightPct;
    scores[leftLetters[dim]] = leftPct;
    scores[rightLetters[dim]] = rightPct;
    mbti += rightCount >= 1 ? rightLetters[dim] : leftLetters[dim];
  });

  return { mbti, scores };
}

/* ========== 手动选型 ========== */
let manualSelections = { IE: 'E', NS: 'N', TF: 'T', JP: 'J' };

function renderManual() {
  const grid = document.getElementById('manual-grid');
  grid.innerHTML = DIM_PAIRS.map(([l, r]) => {
    const dim = l + r;
    return `
      <div class="manual-dim">
        <div class="dim-label">${DIM_LABELS[dim]} · <b>${l} / ${r}</b></div>
        <div class="toggle-row">
          <button class="toggle-btn ${manualSelections[dim] === l ? 'selected' : ''}" data-dim="${dim}" data-v="${l}">${l}</button>
          <button class="toggle-btn ${manualSelections[dim] === r ? 'selected' : ''}" data-dim="${dim}" data-v="${r}">${r}</button>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const dim = btn.dataset.dim, v = btn.dataset.v;
      manualSelections[dim] = v;
      btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
}

function computeManualResult() {
  const scores = {};
  DIM_PAIRS.forEach(([l, r]) => {
    const dim = l + r;
    const chosen = manualSelections[dim];
    scores[chosen] = 70;
    scores[chosen === l ? r : l] = 30;
  });
  const mbti = manualSelections.IE + manualSelections.NS + manualSelections.TF + manualSelections.JP;
  return { mbti, scores };
}

/* ========== 匹配结果展示 ========== */
function showMatchResult(result) {
  userResult = result;
  const { mbti, scores } = result;
  const cn = mbtiCn(mbti);
  const tagline = mbtiTagline(mbti);

  // 同人格角色（跨作品）
  const matched = window.CHARACTERS.filter(c => c.mbti === mbti);
  const byWork = {};
  matched.forEach(c => {
    if (!byWork[c.work]) byWork[c.work] = [];
    byWork[c.work].push(c);
  });

  const scoreChips = DIM_PAIRS.map(([l, r]) =>
    `<span class="score-chip">${l}${r} · <b>${scores[l]}%</b> / ${scores[r]}%</span>`).join('');

  let charHtml = '';
  if (matched.length === 0) {
    charHtml = '<div class="empty-tip">很遗憾，目前还没有这个类型的角色被分析过～</div>';
  } else {
    Object.keys(byWork).forEach(work => {
      const cards = byWork[work].map(c => `
        <a class="char-card" href="${c.link}">
          <div class="cc-top">
            <div class="cc-avatar">${c.name[0]}</div>
            <div>
              <div class="cc-name">${c.name}</div>
              <div class="cc-work">${c.work}</div>
            </div>
          </div>
          <div class="cc-conf">置信度 ${Math.round(c.confidence * 100)}%</div>
          <div class="cc-kw">${(c.keywords || []).slice(0, 3).map(k => `<span class="kw">${k}</span>`).join('')}</div>
          <span class="cc-arrow">→</span>
        </a>`).join('');
      charHtml += `<div class="group-title">📖 ${work}</div><div class="char-grid">${cards}</div>`;
    });
  }

  document.getElementById('match-result').innerHTML = `
    <div class="result-mbti">${mbti}</div>
    <div class="result-cn">${cn}</div>
    <div class="result-tagline">${tagline}</div>
    <div class="result-scores">${scoreChips}</div>
    <div class="result-chars">
      <div class="group-title" style="margin-top:8px;">🎯 与你同频的角色（${matched.length} 个）</div>
      ${charHtml}
    </div>`;
  document.getElementById('match-result').style.display = 'block';
}

/* ========== 金句卡片 ========== */
let cardChar = null, cardQuote = null;

/* MBTI 颜色映射 */
const mbtiColors = {
  INTJ: '#7c3aed', INTP: '#6366f1', ENTJ: '#dc2626', ENTP: '#f59e0b',
  INFJ: '#e11d48', INFP: '#ec4899', ENFJ: '#16a34a', ENFP: '#f97316',
  ISTJ: '#2563eb', ISFJ: '#0891b2', ESTJ: '#059669', ESFJ: '#0d9488',
  ISTP: '#4f46e5', ISFP: '#9333ea', ESTP: '#d97706', ESFP: '#db2777',
};

function mbtiCn(mbti) { return MBTI_INFO[mbti] ? MBTI_INFO[mbti][0] : ''; }

/* 初始化角色筛选器和网格 */
function initCardPage() {
  const chars = window.CHARACTERS;
  const workSet = new Set(), mbtiSet = new Set();
  chars.forEach(c => { workSet.add(c.work); mbtiSet.add(c.mbti); });

  const workSel = document.getElementById('filter-work');
  const mbtiSel = document.getElementById('filter-mbti');
  [...workSet].sort((a, b) => a.localeCompare(b, 'zh')).forEach(w => {
    workSel.innerHTML += `<option value="${w}">${w}</option>`;
  });
  [...mbtiSet].sort().forEach(m => {
    mbtiSel.innerHTML += `<option value="${m}">${m} ${mbtiCn(m)}</option>`;
  });

  workSel.addEventListener('change', renderCharGrid);
  mbtiSel.addEventListener('change', renderCharGrid);
  renderCharGrid();
}

function renderCharGrid() {
  const work = document.getElementById('filter-work').value;
  const mbti = document.getElementById('filter-mbti').value;
  const chars = window.CHARACTERS.filter(c => (!work || c.work === work) && (!mbti || c.mbti === mbti));
  const grid = document.getElementById('char-grid');
  if (chars.length === 0) {
    grid.innerHTML = '<div class="empty-tip">没有匹配的角色</div>';
    return;
  }
  grid.innerHTML = chars.map(c => {
    const initial = c.name[0];
    const color = mbtiColors[c.mbti] || '#7c5cff';
    const sel = cardChar && cardChar.name === c.name ? ' selected' : '';
    return `<div class="char-card${sel}" data-name="${c.name}">
      ${c.img ? `<img class="cc-avatar" src="${c.img}" alt="${c.name}" loading="lazy">` :
        `<div class="cc-avatar-fallback" style="background:${color}">${initial}</div>`}
      <div class="cc-name">${c.name}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.char-card').forEach(el => {
    el.addEventListener('click', () => {
      grid.querySelectorAll('.char-card').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectChar(el.dataset.name);
    });
  });
}

function selectChar(name) {
  cardChar = window.CHARACTERS.find(c => c.name === name);
  const list = document.getElementById('card-quotes');
  if (!cardChar || !cardChar.quotes || cardChar.quotes.length === 0) {
    list.innerHTML = '<div class="empty-tip">这个角色暂时没有提取到金句～</div>';
    return;
  }
  list.innerHTML = cardChar.quotes.map((q, i) => `
    <div class="quote-item ${i === 0 ? 'selected' : ''}" data-i="${i}">「${q}」</div>`).join('');
  list.querySelectorAll('.quote-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.quote-item').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      cardQuote = cardChar.quotes[+el.dataset.i];
      drawCard();
    });
  });
  cardQuote = cardChar.quotes[0];
  drawCard();
}

function wrapText(ctx, text, maxWidth) {
  const chars = text.split('');
  const lines = [];
  let line = '';
  for (const ch of chars) {
    if (ctx.measureText(line + ch).width > maxWidth) {
      lines.push(line);
      line = ch;
    } else {
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawCard() {
  if (!cardChar || !cardQuote) return;
  const img = new Image();
  img.onload = () => drawCardBase(img);
  img.onerror = () => drawCardBase(null);
  img.src = cardChar.img || '';
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCardBase(portrait) {
  if (!cardChar || !cardQuote) return;
  const canvas = document.getElementById('quote-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // 背景渐变
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#1a1240');
  grad.addColorStop(0.5, '#2d1b4e');
  grad.addColorStop(1, '#4a1942');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 装饰光斑
  const glow = ctx.createRadialGradient(W * 0.15, H * 0.12, 0, W * 0.15, H * 0.12, 320);
  glow.addColorStop(0, 'rgba(124,92,255,0.35)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  const glow2 = ctx.createRadialGradient(W * 0.9, H * 0.85, 0, W * 0.9, H * 0.85, 360);
  glow2.addColorStop(0, 'rgba(255,107,157,0.3)');
  glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);

  const avatarColor = mbtiColors[cardChar.mbti] || '#7c5cff';

  // ---- 顶部：头像 ----
  const avatarX = W / 2, avatarY = 165, avatarR = 95;

  // 头像外圈光晕
  const glowR = ctx.createRadialGradient(avatarX, avatarY, avatarR * 0.6, avatarX, avatarY, avatarR * 1.8);
  glowR.addColorStop(0, avatarColor + '55');
  glowR.addColorStop(1, 'transparent');
  ctx.fillStyle = glowR;
  ctx.fillRect(avatarX - avatarR * 2, avatarY - avatarR * 2, avatarR * 4, avatarR * 4);

  // 圆形头像
  ctx.save();
  ctx.beginPath();
  ctx.arc(avatarX, avatarY, avatarR, 0, Math.PI * 2);
  ctx.clip();
  if (portrait && portrait.width > 0) {
    // 以人物面部为中心裁切
    const side = Math.min(portrait.width, portrait.height);
    const sx = (portrait.width - side) / 2;
    const sy = (portrait.height - side) * 0.18;
    ctx.drawImage(portrait, sx, sy, side, side, avatarX - avatarR, avatarY - avatarR, avatarR * 2, avatarR * 2);
  } else {
    const avGrad = ctx.createLinearGradient(avatarX - avatarR, avatarY - avatarR, avatarX + avatarR, avatarY + avatarR);
    avGrad.addColorStop(0, avatarColor);
    avGrad.addColorStop(1, '#fff');
    ctx.fillStyle = avGrad;
    ctx.fillRect(avatarX - avatarR, avatarY - avatarR, avatarR * 2, avatarR * 2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 76px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cardChar.name[0], avatarX, avatarY + 2);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();

  // 头像边框（MBTI 色）
  ctx.beginPath();
  ctx.arc(avatarX, avatarY, avatarR, 0, Math.PI * 2);
  ctx.strokeStyle = avatarColor;
  ctx.lineWidth = 5;
  ctx.stroke();

  // ---- 角色名（与头像拉开间距）----
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 80px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(cardChar.name, W / 2, 380);

  // ---- MBTI 徽章 ----
  const badgeText = cardChar.mbti + ' ' + mbtiCn(cardChar.mbti);
  ctx.font = 'bold 40px "PingFang SC", "Microsoft YaHei", sans-serif';
  const badgeW = ctx.measureText(badgeText).width + 60;
  const badgeH = 68, badgeY = 436;
  const badgeX = (W - badgeW) / 2;
  ctx.shadowColor = avatarColor;
  ctx.shadowBlur = 26;
  ctx.fillStyle = avatarColor;
  roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, 34);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(badgeText, W / 2, badgeY + badgeH / 2 + 2);
  ctx.textBaseline = 'alphabetic';

  // ---- 作品 ----
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '28px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('📖 ' + cardChar.work, W / 2, 545);

  // ---- 分隔线 ----
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(200, 600);
  ctx.lineTo(W - 200, 600);
  ctx.stroke();

  // ---- 金句（在 600-1020 区域垂直居中）----
  ctx.fillStyle = '#f3efff';
  ctx.font = '50px "PingFang SC", "Microsoft YaHei", sans-serif';
  const lines = wrapText(ctx, '「' + cardQuote + '」', W - 240);
  const lineH = 84;
  const quoteTop = 600, quoteBottom = 1020;
  const blockH = lines.length * lineH;
  let y = quoteTop + (quoteBottom - quoteTop - blockH) / 2 + lineH;
  lines.forEach(line => {
    ctx.fillText(line, W / 2, y);
    y += lineH;
  });

  // ---- MBTI 四维度能量条 ----
  const sc = cardChar.scores || {};
  const dims = [
    ['E', 'I', sc.E, sc.I],
    ['N', 'S', sc.N, sc.S],
    ['T', 'F', sc.T, sc.F],
    ['J', 'P', sc.J, sc.P],
  ];
  const barW = 520, barH = 26, barGap = 46;
  const barX = (W - barW) / 2;
  const barStartY = 1048;
  dims.forEach((d, i) => {
    const [dom, rec, domPct, recPct] = d;
    const y = barStartY + i * barGap;
    const pct = (typeof domPct === 'number') ? domPct : 50;
    // 轨道
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRectPath(ctx, barX, y, barW, barH, 13);
    ctx.fill();
    // 填充
    ctx.fillStyle = avatarColor;
    roundRectPath(ctx, barX, y, barW * pct / 100, barH, 13);
    ctx.fill();
    // 左标签：主导字母 + 百分比
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(dom + ' ' + pct + '%', barX - 24, y + barH / 2 + 10);
    // 右标签：次要字母
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.textAlign = 'left';
    ctx.fillText(rec, barX + barW + 24, y + barH / 2 + 10);
    ctx.textAlign = 'center';
  });

  // ---- 底部 ----
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '30px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('角色鉴定所 · AI 眼中的影视与文学角色', W / 2, H - 110);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '26px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('bearts13.github.io/character-mbti', W / 2, H - 60);
}

document.getElementById('card-download').addEventListener('click', () => {
  if (!cardChar || !cardQuote) { alert('请先选择一个角色和金句～'); return; }
  const canvas = document.getElementById('quote-canvas');
  const a = document.createElement('a');
  a.download = `${cardChar.name}_金句卡片.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});

/* ========== 初始化 ========== */
/* 模式切换 */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.getElementById('quiz-mode').style.display = mode === 'quiz' ? 'block' : 'none';
    document.getElementById('manual-mode').style.display = mode === 'manual' ? 'block' : 'none';
    document.getElementById('match-result').style.display = 'none';
  });
});

document.getElementById('quiz-submit').addEventListener('click', () => {
  showMatchResult(computeQuizResult());
});
document.getElementById('manual-submit').addEventListener('click', () => {
  showMatchResult(computeManualResult());
});

renderQuiz();
renderManual();
renderMbtiGrid();
initCardPage();
</script>
</body>
</html>
